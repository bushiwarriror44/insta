services:
  reels-ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: insta-reels-ollama
    restart: unless-stopped
    mem_limit: 8g
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  reels-ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: insta-reels-ollama-pull
    mem_limit: 4g
    depends_on:
      reels-ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://reels-ollama:11434
      AGENT_MODEL: ${AGENT_MODEL:-qwen3:8b}
    volumes:
      - ./docker/ollama-pull.sh:/pull.sh:ro
    entrypoint: ["sh", "/pull.sh"]
    restart: "no"

  reels-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: insta-reels-worker:latest
    container_name: insta-reels-worker
    restart: unless-stopped
    mem_limit: 2g
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - playwright-browsers:/ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PANEL_BASE_URL: http://reels-frontend:80
      OLLAMA_AUTOSTART: "false"
      WORKER_AUTOSTART: "false"
    command: ["run-worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -m app.cli status > /tmp/healthcheck.log 2>&1 || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 45s

  reels-api:
    image: insta-reels-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insta-reels-api
    restart: unless-stopped
    mem_limit: 2g
    shm_size: "1gb"
    environment:
      DISPLAY: ":99"
      BROWSER_VNC_ENABLED: "true"
      PANEL_BASE_URL: http://reels-frontend:80
      OLLAMA_AUTOSTART: "false"
      WORKER_AUTOSTART: "false"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - playwright-browsers:/ms-playwright
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run-api"]
    ports:
      - "8000:8000"
    depends_on:
      reels-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reels-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: insta-reels-frontend:latest
    container_name: insta-reels-frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "3000:80"
    depends_on:
      reels-api:
        condition: service_started

volumes:
  playwright-browsers:
  ollama-data:
